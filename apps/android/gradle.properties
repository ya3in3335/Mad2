org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Network resilience against repository rate limiting (HTTP 429): Gradle retries with exponential backoff
# (initial 2 s, doubling) instead of failing immediately. Only official repositories are configured.
org.gradle.internal.repository.max.tentatives=5
org.gradle.internal.repository.initial.backoff=2000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000
# Reuse outputs and the dependency cache between builds.
org.gradle.caching=true
