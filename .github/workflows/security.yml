name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Forbid committed keystores / private keys
        run: |
          if git ls-files | grep -Ei '\.(jks|keystore|p12|pfx|pem|key)$'; then echo "Signing material must not be committed"; exit 1; fi
